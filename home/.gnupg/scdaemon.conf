# Shared PC/SC access, so scdaemon does not fail with a sharing violation when
# another client (ykman, OpenSC) also holds the YubiKey.
pcsc-shared

# scdaemon probes the YubiKey PIV applet on every gpg call, and switching
# back to OpenPGP drops the verified PIN. With pcsc-shared the PIN is never
# cached, so each signature asked for it again. PIV is not used through gpg.
disable-application piv
