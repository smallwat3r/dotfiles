# Pin the agent socket to the path environment.d/10-path.conf exports.
# Fedora already listens there, Debian defaults to %t/openssh_agent and
# would leave SSH_AUTH_SOCK pointing at nothing.
[Socket]
ListenStream=
ListenStream=%t/ssh-agent.socket
ExecStartPost=
ExecStartPost=/usr/bin/systemctl --user set-environment SSH_AUTH_SOCK=%t/ssh-agent.socket
