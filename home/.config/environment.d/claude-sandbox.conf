# Defaults for the claude-docker launcher, which lives in a separate
# repository, github.com/smallwat3r/claude-sandbox (bin/claude-docker).
# 1 lets a session run docker ps and docker logs on the host daemon,
# inspect stays stubbed (that would need "full").
CLAUDE_DOCKER_SOCKET=1
# Open egress, no squid allowlist. Already the launcher default, pinned
# here so the personal setup does not depend on it.
CLAUDE_DOCKER_NET_FILTER=0
# Keep ~/.cache in a per-project volume between sessions (0 would use a
# tmpfs). Also the launcher default, pinned for the same reason.
CLAUDE_DOCKER_CACHE=1
# Line mode, Claude Code without its full-screen UI, with the session's
# network and calls shown under the prompt. Also the launcher default,
# pinned for the same reason.
CLAUDE_DOCKER_LINE_MODE=1
# Run sessions under gVisor, on its own user space kernel, so a session
# cannot exploit a flaw in the host's kernel. Not the launcher default,
# it needs runsc installed and registered with Docker under this name
# (docs/sandbox.md in claude-sandbox). An empty value falls back to
# Docker's own runtime.
CLAUDE_DOCKER_RUNTIME=runsc-hostnet
