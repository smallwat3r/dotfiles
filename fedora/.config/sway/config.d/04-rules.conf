# Window rules

for_window [shell="xdg_shell"] title_format "%app_id :: %title"
for_window [shell="xwayland"] title_format "[x11] %class :: %title"

# App emojis (must come after the generic title_format rules above)
for_window [app_id="firefox"] title_format "🦊 %title"
for_window [app_id="emacs"] title_format "🐃 %title"
for_window [class="Emacs"] title_format "🐃 %title"
for_window [app_id="Slack"] title_format "💬 %title"
for_window [class="Slack"] title_format "💬 %title"
for_window [app_id="^foot$"] title_format "📟 %title"
for_window [app_id="Bitwarden"] title_format "🔐 %title"
for_window [app_id="google-chrome"] title_format "🌎 %title"
for_window [class="Google-chrome"] title_format "🌎 %title"
for_window [app_id="pavucontrol"] title_format "🔊 %title"
for_window [app_id="blueman-manager"] title_format "🔵 %title"
for_window [app_id="nm-connection-editor"] title_format "🌐 %title"
for_window [app_id="org.gnome.Calendar"] title_format "📅 %title"
for_window [app_id="com.yubico.yubioath"] title_format "🔑 %title"
for_window [app_id="gnome-power-statistics"] title_format "🔋 %title"

for_window [title="^launcher$"] floating enable, border pixel 1, sticky enable, move to output current, resize set width 100 ppt, move position 0 0, focus

# Foot terminals live on their own workspace, tiled side by side (the
# global workspace_layout is tabbed, so force a split layout there)
assign [app_id="^foot$"] workspace number 10
for_window [app_id="^foot$"] layout splith, urgent enable
for_window [title="^floating$"] floating enable, border pixel 1
for_window [app_id="Bitwarden"] floating enable
for_window [app_id="com.yubico.yubioath"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="blueman-manager"] floating enable
for_window [app_id="gnome-power-statistics"] floating enable
for_window [app_id="org.gnome.Calendar"] floating enable

# Auto-mark windows and set urgent (for waybar alert)
for_window [app_id="emacs"] mark e, urgent enable
for_window [class="Emacs"] mark e, urgent enable
for_window [app_id="firefox"] layout tabbed, urgent enable
for_window [app_id="Slack"] mark s, urgent enable
for_window [class="Slack"] mark s, urgent enable

# Inhibit idle for fullscreen windows
for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen

# Picture-in-Picture and video calls
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable
for_window [app_id="xdg-desktop-portal-gtk"] floating enable

# Screen sharing indicators
for_window [title="meet.google.com is sharing your screen."] floating enable, border none, nofocus
for_window [title=".*is sharing your screen.*"] floating enable, border none, nofocus
